services:
  backend_api:
    build:
      context: ..
      dockerfile: backend_api_integration_anghelo/Dockerfile
    image: backend-api-integration:latest
    container_name: backend-api-integration
    ports:
      - "8000:8000"
    environment:
      - STORAGE_TYPE=memory
      - CACHE_DIR=/app/data/cache
      - IMAGES_DIR=/app/data/images
      - CACHE_TTL_HOURS=24
    volumes:
      # Datos volátiles del backend (FITS crudos y PNGs renderizados)
      - ./backend_api_integration_anghelo/data/cache:/app/data/cache
      - ./backend_api_integration_anghelo/data/images:/app/data/images
