services:
  backend_api:
    build:
      context: ..
      dockerfile: backend_api_integration_anghelo/Dockerfile
    image: backend-api-integration:latest
    container_name: backend-api-integration
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../backend_api_integration_anghelo:/app/backend_api_integration_anghelo
      - ../spherex_data_pipeline_elide:/app/spherex_data_pipeline_elide
      - ../scientific_motion_engine_etner:/app/scientific_motion_engine_etner
    command: ["fastapi", "run", "main.py", "--host", "0.0.0.0", "--port", "8000", "--reload"]
