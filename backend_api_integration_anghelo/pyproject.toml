[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-api-integration"
version = "0.1.0"
description = "SPHEREx Planet X backend API integration (P3) — Service-Layer architecture."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "numpy>=1.26",
    "astropy>=6.0",
    "Pillow>=10.0",
    "python-multipart>=0.0.6",
    "motor>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
